name: Publicar no Roblox

# Sempre que o codigo do jogo muda na branch main, monta o place com o Rojo
# e publica no Roblox. Antes, confere a sintaxe de todos os scripts.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "default.project.json"
      - "automacao/**"
      - "malhas/**"
  workflow_dispatch:

concurrency:
  group: publicacao
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Conferir a sintaxe dos scripts
        run: |
          sudo apt-get install -y -qq lua5.1 > /dev/null
          erro=0
          for f in $(find src -name "*.lua"); do
            luac5.1 -p "$f" || erro=1
          done
          exit $erro

      - name: Testar o modelo de voo
        run: lua5.1 teste/teste_fisica.lua decolagem | tail -20

      - name: Teste da fisica do helicoptero
        run: lua5.1 teste/teste_heli.lua | tail -30

      - name: Enviar malhas 3D novas para o Roblox
        continue-on-error: true
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ vars.UNIVERSE_ID }}
          CRIADOR_ID: ${{ vars.CRIADOR_ID }}
        run: |
          python3 automacao/enviar_malhas.py
          if [ -n "$(git status --porcelain malhas/ids.json src/ReplicatedStorage/FAB/MalhasIds.lua)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add malhas/ids.json src/ReplicatedStorage/FAB/MalhasIds.lua
            git commit -m "Atualiza IDs das malhas [skip ci]"
            git push || echo "Nao foi possivel salvar os IDs no repositorio; seguem valendo nesta publicacao."
          fi

      - name: Montar e publicar o place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          UNIVERSE_ID: ${{ vars.UNIVERSE_ID }}
          PLACE_ID: ${{ vars.PLACE_ID }}
        run: bash automacao/publicar.sh
